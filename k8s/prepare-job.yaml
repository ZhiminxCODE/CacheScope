apiVersion: batch/v1
kind: Job
metadata:
  name: prepare-data
  namespace: cachescope
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        cachescope-demo: "true"
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prepare
          image: cachescope:local
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "cachescope_runner", "prepare", "/data", "--size", "256MiB"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          hostPath:
            path: /var/local/cachescope-data
            type: Directory
