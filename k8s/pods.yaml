apiVersion: v1
kind: Pod
metadata:
  name: reader-a
  namespace: cachescope
spec:
  nodeSelector:
    cachescope-demo: "true"
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: reader
      image: cachescope:local
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          memory: 512Mi
      volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
  volumes:
    - name: data
      hostPath:
        path: /var/local/cachescope-data
        type: Directory
---
